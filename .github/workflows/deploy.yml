name: Deploy

on:
  workflow_dispatch:
    #branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/api-task

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.IMAGE }}:latest

            # Общая сеть: приложение обращается к Qdrant по имени контейнера.
            docker network create mentoring-net 2>/dev/null || true

            # Qdrant поднимаем, только если его ещё нет; данные — на диске сервера.
            docker inspect qdrant >/dev/null 2>&1 || docker run -d \
              --name qdrant \
              --restart unless-stopped \
              --network mentoring-net \
              -v /opt/qdrant_data:/qdrant/storage \
              qdrant/qdrant:v1.12.0
            docker network connect mentoring-net qdrant 2>/dev/null || true

            docker rm -f api-task 2>/dev/null || true
            docker run -d \
              --name api-task \
              --restart unless-stopped \
              --network mentoring-net \
              -p 127.0.0.1:8000:8000 \
              -e LOG_LEVEL=INFO \
              -e QDRANT_URL=http://qdrant:6333 \
              -e LLM_API_KEY='${{ secrets.LLM_API_KEY }}' \
              ${{ env.IMAGE }}:latest
            docker logout ghcr.io